plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

base { archivesName = "Dynmap" }
version = parent.version
group = parent.group

eclipse {
    project {
        name = "Dynmap(Fabric-26.2)"
    }
}

configurations {
    bundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
}

dependencies {
    // Minecraft 26.x ships de-obfuscated; Loom consumes the official names
    // directly, so there is NO `mappings` dependency and mod dependencies use
    // the plain `implementation`/`compileOnly` configurations (nothing to remap).
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'

    implementation project(path: ':DynmapCore', configuration: 'shadow')
    bundle project(path: ':DynmapCore', configuration: 'shadow')

    compileOnly "me.lucko:fabric-permissions-api:0.7.0"
    compileOnly 'net.luckperms:api:5.4'
}

loom {
    accessWidenerPath = file("src/main/resources/dynmap.accesswidener")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

processResources {
    filesMatching('fabric.mod.json') {
        expand "version": project.version
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Minecraft 26.x is de-obfuscated, so Loom performs no jar remap: the `jar`
// task output IS the finished mod jar. Bundle DynmapCore and name it to match
// the other Dynmap artifacts.
jar {
    from "LICENSE"
    from {
        configurations.bundle.collect { it.toString().contains("guava") ? null : it.isDirectory() ? it : zipTree(it) }
    }
    archiveFileName = "${base.archivesName.get()}-${project.version}-fabric-${project.minecraft_version}.jar"
    destinationDirectory = file('../target')
    doLast {
        ant.checksum file: archiveFile.get().asFile
    }
}
